# docker-compose.yml
version: '3.8'

services:
  # MongoDB Service
  mongo:
    image: mongo:6
    container_name: docmanager-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: docmanager
    networks:
      - docmanager-network

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmanager-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/docmanager
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      API_URL: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads  # Persist uploaded files
    networks:
      - docmanager-network

volumes:
  mongo-data:
    driver: local

networks:
  docmanager-network:
    driver: bridge